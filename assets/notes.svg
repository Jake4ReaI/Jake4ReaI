<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
  <title id="t">Notes about Jake</title>
  <desc id="d">1. I build for the browser first, then the server behind it. 2. I learn by building, breaking, and reading the error. 3. If it works but I can't explain it, it isn't finished.</desc>
  <style>
    svg{--bg:#11376a;--grid:#1a4680;--grid2:#27589a;--ink:#e6f0fb;--soft:#9fbde0;--red:#ff8478}
    @media(prefers-color-scheme:light){svg{--bg:#eaf1f8;--grid:#d7e3ef;--grid2:#bccfe3;--ink:#11376a;--soft:#4a6a92;--red:#c22f20}}
    text{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
    .bg{fill:var(--bg)}
    .minor{fill:none;stroke:var(--grid)}
    .major{fill:none;stroke:var(--grid2);stroke-width:1.5}
    .frame{stroke:var(--ink);stroke-width:1.5}
    .head{fill:var(--ink);font-weight:800;font-size:48px;letter-spacing:-1.5px}
    .rule{fill:none;stroke:var(--red);stroke-width:5;stroke-dasharray:101;animation:draw .8s .3s ease-out backwards}
    .note{fill:var(--ink);font-weight:500;font-size:24px}
    .n{fill:var(--red);font-weight:700}
    .block{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
    .cap{fill:var(--soft);font-weight:600;font-size:12px;letter-spacing:1.6px}
    .val{fill:var(--ink);font-weight:600;font-size:18px}
    @keyframes draw{from{stroke-dashoffset:101}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path class="minor" d="M20 0H0V20"/></pattern>
    <pattern id="G" width="100" height="100" patternUnits="userSpaceOnUse" patternTransform="translate(20 20)"><rect width="100" height="100" fill="url(#g)"/><path class="major" d="M100 0H0V100"/></pattern>
  </defs>

  <rect class="bg" width="1200" height="280" rx="8"/>
  <rect class="frame" x="20" y="20" width="1160" height="240" fill="url(#G)"/>

  <text class="head" x="60" y="106">Notes</text>
  <path class="rule" pathLength="100" d="M62 128H142"/>

  <text class="note" y="98"><tspan class="n" x="340">1</tspan><tspan x="376">I build for the browser first, then the server behind it.</tspan></text>
  <text class="note" y="148"><tspan class="n" x="340">2</tspan><tspan x="376">I learn by building, breaking, and reading the error.</tspan></text>
  <text class="note" y="198"><tspan class="n" x="340">3</tspan><tspan x="376">If it works but I can't explain it, it isn't finished.</tspan></text>

  <rect class="block" x="1000" y="220" width="180" height="40"/>
  <text class="cap" x="1014" y="245">SHEET</text><text class="val" x="1082" y="246">2 of 3</text>
</svg>
