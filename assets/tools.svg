<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Tools Jake uses</title>
  <desc id="d">Luau, Java, Python, JavaScript, HTML, CSS, Git, GitHub.</desc>
  <style>
    text{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
    .label{fill:#ffc2c8;font-size:15px;font-weight:600;letter-spacing:6px}
    .acc{fill:#ff5c6c}
    .hair{fill:none;stroke:#fff;stroke-opacity:.14}
    .dot{fill:#ff4558}
    .tool{fill:#fbf3f3;font-weight:600;font-size:28px;letter-spacing:-.4px}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a30f1f"/>
      <stop offset=".34" stop-color="#4a0911"/>
      <stop offset=".66" stop-color="#12070a"/>
      <stop offset="1" stop-color="#060506"/>
    </linearGradient>
    <radialGradient id="gw" cx=".12" cy="1.05" r=".75">
      <stop offset="0" stop-color="#ff3348" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff3348" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge">
      <stop offset="0" stop-color="#ff5564" stop-opacity=".85"/>
      <stop offset=".6" stop-color="#5a1a20" stop-opacity=".7"/>
      <stop offset="1" stop-color="#2a1518"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#gw)"/>
  <rect x=".75" y=".75" width="1198.5" height="298.5" rx="15.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <text class="label" x="60" y="80">TOOLS</text>
  <rect class="acc" x="60" y="96" width="40" height="2"/>

  <path class="hair" d="M340 60H1140M340 150H1140M340 240H1140M540 60V240M740 60V240M940 60V240"/>

  <rect class="dot" x="340" y="101" width="8" height="8" rx="2"/><text class="tool" x="360" y="115">Luau</text>
  <rect class="dot" x="560" y="101" width="8" height="8" rx="2"/><text class="tool" x="580" y="115">Java</text>
  <rect class="dot" x="760" y="101" width="8" height="8" rx="2"/><text class="tool" x="780" y="115">Python</text>
  <rect class="dot" x="960" y="101" width="8" height="8" rx="2"/><text class="tool" x="980" y="115">JavaScript</text>
  <rect class="dot" x="340" y="191" width="8" height="8" rx="2"/><text class="tool" x="360" y="205">HTML</text>
  <rect class="dot" x="560" y="191" width="8" height="8" rx="2"/><text class="tool" x="580" y="205">CSS</text>
  <rect class="dot" x="760" y="191" width="8" height="8" rx="2"/><text class="tool" x="780" y="205">Git</text>
  <rect class="dot" x="960" y="191" width="8" height="8" rx="2"/><text class="tool" x="980" y="205">GitHub</text>
</svg>
