<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Tools Jake uses</title>
  <desc id="d">Languages: Luau, Java, Python, JavaScript. Web: HTML, CSS, Vue.js, Node.js. Version control: Git, GitHub. Beside the list, a small graphics card drawn in 3D with two spinning fans.</desc>
  <style>
    text{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
    .run{fill:none;stroke:#ffd9dc;animation:run 12s linear -8s infinite}
    .run.a{stroke-width:1.5;stroke-opacity:.45;stroke-dasharray:0 88 12 0}
    .run.b{stroke-width:2;stroke-opacity:.95;stroke-dasharray:0 96.5 3.5 0}
    .label{fill:#ffc2c8;font-size:15px;font-weight:600;letter-spacing:6px}
    .acc{fill:#ff5c6c}
    .hair{fill:none;stroke:#fff;stroke-opacity:.14}
    .cat{fill:#e9bcc1;font-size:15px;font-weight:500}
    .logo{fill:#ffe1e4;fill-opacity:.78;animation:lit 6s ease-in-out infinite}
    .tool{fill:#fbf3f3;font-weight:600;font-size:22px;letter-spacing:-.2px}
    .gpu *{stroke:#ffe3e6;stroke-opacity:.85;stroke-width:1.2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    .side{fill:#1a0508;fill-opacity:.6}
    .top{fill:#2a0a0f;fill-opacity:.65}
    .fan{fill:none;transform-box:fill-box;transform-origin:center;animation:spin 2.8s linear infinite}
    .fan.two{animation-delay:-1.1s}
    .hub{fill:#2a0a0f}
    .gpu .led{stroke:#ff4558;stroke-opacity:1;stroke-width:2.5;animation:led 3s ease-in-out infinite alternate}
    @keyframes run{to{stroke-dashoffset:-100}}
    @keyframes lit{0%,14%,100%{fill-opacity:.78}7%{fill-opacity:1;fill:#ffffff}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes led{from{stroke-opacity:.45}to{stroke-opacity:1}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a30f1f"/>
      <stop offset=".34" stop-color="#4a0911"/>
      <stop offset=".66" stop-color="#12070a"/>
      <stop offset="1" stop-color="#060506"/>
    </linearGradient>
    <radialGradient id="gw" cx=".12" cy="1.05" r=".75">
      <stop offset="0" stop-color="#ff3348" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff3348" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge">
      <stop offset="0" stop-color="#ff5564" stop-opacity=".85"/>
      <stop offset=".6" stop-color="#5a1a20" stop-opacity=".7"/>
      <stop offset="1" stop-color="#2a1518"/>
    </linearGradient>
    <path id="frame" pathLength="100" d="M16 .75H1184A15.25 15.25 0 0 1 1199.25 16V324A15.25 15.25 0 0 1 1184 339.25H16A15.25 15.25 0 0 1 .75 324V16A15.25 15.25 0 0 1 16 .75Z"/>
    <g id="blades">
      <path transform="rotate(0.00)" d="M0 -10C11 -14 17 -24 12 -35"/>
      <path transform="rotate(51.43)" d="M0 -10C11 -14 17 -24 12 -35"/>
      <path transform="rotate(102.86)" d="M0 -10C11 -14 17 -24 12 -35"/>
      <path transform="rotate(154.29)" d="M0 -10C11 -14 17 -24 12 -35"/>
      <path transform="rotate(205.71)" d="M0 -10C11 -14 17 -24 12 -35"/>
      <path transform="rotate(257.14)" d="M0 -10C11 -14 17 -24 12 -35"/>
      <path transform="rotate(308.57)" d="M0 -10C11 -14 17 -24 12 -35"/>
    </g>
  </defs>

  <rect width="1200" height="340" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="16" fill="url(#gw)"/>
  <use href="#frame" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <use href="#frame" class="run a"/>
  <use href="#frame" class="run b"/>

  <text class="label" x="60" y="80">TOOLS</text>
  <rect class="acc" x="60" y="96" width="40" height="2"/>

  <!-- graphics card in isometric view: two side faces, edge connector, top face with two fans -->
  <g class="gpu" transform="translate(128 132) scale(.78)" aria-hidden="true">
    <path class="side" d="M-60.6 87L43.3 147V157L-60.6 97Z"/>
    <path class="side" d="M-86.6 50L103.9 160V182L-86.6 72Z"/>
    <path class="side" d="M190.5 110L103.9 160V182L190.5 132Z"/>
    <path class="led" d="M-77.9 62L17.3 117"/>
    <g transform="matrix(.866 .5 -.866 .5 0 0)">
      <rect class="top" width="220" height="100"/>
      <g transform="translate(62 50)"><g class="fan"><circle r="38"/><use href="#blades"/></g><circle class="hub" r="9"/></g>
      <g transform="translate(158 50)"><g class="fan two"><circle r="38"/><use href="#blades"/></g><circle class="hub" r="9"/></g>
    </g>
  </g>

  <path class="hair" d="M340 56H1140M340 132H1140M340 208H1140M340 284H1140"/>

  <text class="cat" x="340" y="99">Languages</text>
