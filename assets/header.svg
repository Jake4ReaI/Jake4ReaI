<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Jake</title>
  <desc id="d">A slowly turning wireframe globe with a satellite circling it, beside the name Jake in large custom letters, over a red to black gradient. AI specialist and programmer. I build things, break them, then rebuild them better. github.com/Jake4ReaI</desc>
  <style>
    text{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
    .run{fill:none;stroke:#ffd9dc;animation:run 12s linear infinite}
    .run.a{stroke-width:1.5;stroke-opacity:.45;stroke-dasharray:0 88 12 0}
    .run.b{stroke-width:2;stroke-opacity:.95;stroke-dasharray:0 96.5 3.5 0}
    .mark{fill:none;stroke:#ff7f8a;stroke-opacity:.75;stroke-width:1.5}
    .globe *{fill:none;stroke:#ffe3e6}
    .rim{stroke-width:1.5;stroke-opacity:.9}
    .lat{stroke-opacity:.38}
    .mer{stroke-opacity:.62;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:turn 18s cubic-bezier(.37,0,.63,1) infinite}
    .mer:nth-of-type(2){animation-delay:-1.5s}.mer:nth-of-type(3){animation-delay:-3s}.mer:nth-of-type(4){animation-delay:-4.5s}.mer:nth-of-type(5){animation-delay:-6s}.mer:nth-of-type(6){animation-delay:-7.5s}
    .ring{stroke-opacity:.3}
    .sat{animation:run 9s linear infinite}
    .sat.t1{stroke-width:1.5;stroke-opacity:.35;stroke-dasharray:0 80 20 0}
    .sat.t2{stroke-width:2.5;stroke-opacity:.75;stroke-dasharray:0 92 8 0}
    .sat.halo{stroke:#ff5c6c;stroke-opacity:.4;stroke-width:22;stroke-linecap:round;stroke-dasharray:0 100}
    .sat.head{stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-dasharray:0 100}
    .hair{fill:none;stroke:#fff;stroke-opacity:.16;stroke-dasharray:101;animation:draw 1s ease-out backwards}
    .ink path{fill:none;stroke:url(#ink);stroke-width:28;stroke-dasharray:101;animation:draw 1.1s cubic-bezier(.65,0,.25,1) backwards}
    .ink path:nth-child(1){animation-delay:.3s}.ink path:nth-child(2){animation-delay:.55s}.ink path:nth-child(3){animation-delay:.8s}.ink path:nth-child(4){animation-delay:1.05s}
    .glint{animation:glide 12s ease-in-out infinite alternate}
    .role{fill:#ffc2c8;font-size:15px;font-weight:600;letter-spacing:3px}
    .say{fill:#fbf3f3;font-size:24px;font-weight:500}
    .at{fill:#cdb6b9;font-size:15px;letter-spacing:1.5px}
    @keyframes run{to{stroke-dashoffset:-100}}
    @keyframes draw{from{stroke-dashoffset:101}}
    @keyframes glide{to{transform:translateX(512px)}}
    @keyframes turn{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a30f1f"/>
      <stop offset=".34" stop-color="#4a0911"/>
      <stop offset=".66" stop-color="#12070a"/>
      <stop offset="1" stop-color="#060506"/>
    </linearGradient>
    <radialGradient id="gw" cx=".12" cy="1.05" r=".75">
      <stop offset="0" stop-color="#ff3348" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ff3348" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge">
      <stop offset="0" stop-color="#ff5564" stop-opacity=".85"/>
      <stop offset=".6" stop-color="#5a1a20" stop-opacity=".7"/>
      <stop offset="1" stop-color="#2a1518"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="280">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffc7cc"/>
    </linearGradient>
    <linearGradient id="gl">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cap"><rect x="0" y="80" width="1200" height="200"/></clipPath>
    <path id="frame" pathLength="100" d="M16 .75H1184A15.25 15.25 0 0 1 1199.25 16V404A15.25 15.25 0 0 1 1184 419.25H16A15.25 15.25 0 0 1 .75 404V16A15.25 15.25 0 0 1 16 .75Z"/>
    <path id="orbit" pathLength="100" d="M178 0A178 44 0 1 1 -178 0A178 44 0 1 1 178 0"/>
  </defs>

  <rect width="1200" height="420" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="16" fill="url(#gw)"/>
  <use href="#frame" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <!-- a light running round the frame -->
  <use href="#frame" class="run a"/>
  <use href="#frame" class="run b"/>

  <!-- corner marks -->
  <path class="mark" d="M36 54V36H54M1146 36H1164V54M36 366V384H54M1146 384H1164V366"/>

  <!-- globe: fixed rim and latitudes, six meridians turning, a satellite with a trail on a ring -->
  <g class="globe" transform="translate(236 210) rotate(-18)" aria-hidden="true">
    <circle class="rim" r="120"/>
    <ellipse class="lat" rx="120" ry="30"/>
    <ellipse class="lat" cy="-58" rx="104" ry="26"/>
    <ellipse class="lat" cy="58" rx="104" ry="26"/>
    <ellipse class="lat" cy="-100" rx="62" ry="15"/>
    <ellipse class="lat" cy="100" rx="62" ry="15"/>
    <circle class="mer" r="120"/>
    <circle class="mer" r="120"/>
    <circle class="mer" r="120"/>
    <circle class="mer" r="120"/>
    <circle class="mer" r="120"/>
    <circle class="mer" r="120"/>
    <use href="#orbit" class="ring"/>
    <use href="#orbit" class="sat t1"/>
    <use href="#orbit" class="sat t2"/>
    <use href="#orbit" class="sat halo"/>
    <use href="#orbit" class="sat head"/>
  </g>

  <!-- nameplate: J A K E, one stroke weight, cut flat at the cap height and baseline -->
  <g transform="translate(554.4 6) scale(.8)">
    <path class="hair" pathLength="100" d="M60 80H732"/>
    <path class="hair" pathLength="100" d="M60 280H732"/>
    <g class="ink" clip-path="url(#cap)">
      <path pathLength="100" transform="translate(74 0)" d="M110 60V211A55 55 0 0 1 0 211V192"/>
      <path pathLength="100" transform="translate(228 0)" d="M3.5 300L75 80L146.5 300M31 215H119"/>
      <path pathLength="100" transform="translate(410 0)" d="M14 60V300M150 60L14 205M70 145.3L155 300"/>
      <path pathLength="100" transform="translate(602 0)" d="M130 94H14V266H130M14 180H115"/>
    </g>
    <rect class="glint" x="60" y="280" width="160" height="3" fill="url(#gl)"/>
  </g>

  <text class="role" x="602" y="266">AI SPECIALIST / PROGRAMMER</text>
  <text class="say" x="602" y="308">I build things, break them,<tspan x="602" dy="33">then rebuild them better.</tspan></text>
  <text class="at" x="602" y="378">github.com/Jake4ReaI</text>
</svg>
