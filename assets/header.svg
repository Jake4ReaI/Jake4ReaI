<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Jake, drawn on a drafting sheet</title>
  <desc id="d">The name Jake in large drafted letters on a blueprint grid, dimensioned 672 wide by 200 high. I build things for the web and learn by taking them apart.</desc>
  <style>
    svg{--bg:#11376a;--grid:#1a4680;--grid2:#27589a;--ink:#e6f0fb;--soft:#9fbde0;--red:#ff8478;--trace:#d6331f}
    @media(prefers-color-scheme:light){svg{--bg:#eaf1f8;--grid:#d7e3ef;--grid2:#bccfe3;--ink:#11376a;--soft:#4a6a92;--red:#c22f20;--trace:#ff8478}}
    text{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
    .bg{fill:var(--bg)}
    .minor{fill:none;stroke:var(--grid)}
    .major{fill:none;stroke:var(--grid2);stroke-width:1.5}
    .frame{stroke:var(--ink);stroke-width:1.5}
    .guide{fill:none;stroke:var(--soft);stroke-dasharray:101;animation:draw .7s ease-out backwards}
    .ink path{fill:none;stroke:var(--ink);stroke-width:28;stroke-dasharray:101;animation:draw 1.1s cubic-bezier(.65,0,.25,1) backwards}
    .ink path:nth-child(1){animation-delay:.4s}.ink path:nth-child(2){animation-delay:.7s}.ink path:nth-child(3){animation-delay:1s}.ink path:nth-child(4){animation-delay:1.3s}
    .trace path{fill:none;stroke:var(--trace);stroke-width:5;stroke-dasharray:14 200;stroke-dashoffset:14;animation:trace 10s linear infinite}
    .trace path:nth-child(1){animation-delay:4s}.trace path:nth-child(2){animation-delay:4.6s}.trace path:nth-child(3){animation-delay:5.2s}.trace path:nth-child(4){animation-delay:5.8s}
    .dim{animation:fade .6s 2.4s backwards}
    .dim path{fill:none;stroke:var(--red);stroke-width:1.5}
    .dim text{fill:var(--red);font-weight:700;font-size:15px}
    .say{fill:var(--ink);font-weight:500;font-size:22px}
    .block{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
    .cap{fill:var(--soft);font-weight:600;font-size:12px;letter-spacing:1.6px}
    .val{fill:var(--ink);font-weight:600;font-size:21px}
    @keyframes draw{from{stroke-dashoffset:101}}
    @keyframes trace{0%{stroke-dashoffset:14}28%,100%{stroke-dashoffset:-100}}
    @keyframes fade{from{opacity:0}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path class="minor" d="M20 0H0V20"/></pattern>
    <pattern id="G" width="100" height="100" patternUnits="userSpaceOnUse" patternTransform="translate(20 20)"><rect width="100" height="100" fill="url(#g)"/><path class="major" d="M100 0H0V100"/></pattern>
    <clipPath id="cap"><rect x="0" y="80" width="1200" height="200"/></clipPath>
  </defs>

  <rect class="bg" width="1200" height="420" rx="8"/>
  <rect class="frame" x="20" y="20" width="1160" height="380" fill="url(#G)"/>

  <!-- cap height and baseline -->
  <path class="guide" pathLength="100" d="M40 80H796"/>
  <path class="guide" pathLength="100" d="M40 280H796"/>

  <!-- J A K E: one stroke weight, cut flat at the guides -->
  <g clip-path="url(#cap)">
    <g class="ink">
      <path pathLength="100" transform="translate(74 0)" d="M110 60V211A55 55 0 0 1 0 211V192"/>
      <path pathLength="100" transform="translate(228 0)" d="M3.5 300L75 80L146.5 300M31 215H119"/>
      <path pathLength="100" transform="translate(410 0)" d="M14 60V300M150 60L14 205M70 145.3L155 300"/>
      <path pathLength="100" transform="translate(602 0)" d="M130 94H14V266H130M14 180H115"/>
    </g>
    <g class="trace" aria-hidden="true">
      <path pathLength="100" transform="translate(74 0)" d="M110 60V211A55 55 0 0 1 0 211V192"/>
      <path pathLength="100" transform="translate(228 0)" d="M3.5 300L75 80L146.5 300M31 215H119"/>
      <path pathLength="100" transform="translate(410 0)" d="M14 60V300M150 60L14 205M70 145.3L155 300"/>
      <path pathLength="100" transform="translate(602 0)" d="M130 94H14V266H130M14 180H115"/>
    </g>
  </g>

  <g class="dim">
    <path d="M60 292V332M732 292V332M60 320H732M53 327L67 313M725 327L739 313M780 80V280M773 87L787 73M773 287L787 273"/>
    <text x="396" y="311" text-anchor="middle">672</text>
    <text transform="translate(771 180) rotate(-90)" text-anchor="middle">200</text>
  </g>

  <text class="say" x="844" y="97">I build things for the web<tspan x="844" dy="32">and learn by taking them</tspan><tspan x="844" dy="32">apart.</tspan></text>

  <!-- title block -->
  <rect class="block" x="840" y="260" width="340" height="140"/>
  <path class="frame" fill="none" d="M840 330H1180M1040 260V400"/>
  <text class="cap" x="854" y="282">DRAWN BY</text><text class="val" x="854" y="314">Jake</text>
  <text class="cap" x="1054" y="282">SHEET</text><text class="val" x="1054" y="314">1 of 3</text>
  <text class="cap" x="854" y="352">TITLE</text><text class="val" x="854" y="384">GitHub profile</text>
  <text class="cap" x="1054" y="352">REV</text><text class="val" x="1054" y="384">2026</text>
</svg>
