name: Generate contribution snake

on:
  schedule:
    - cron: "37 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Build light and dark contribution animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#c1121f&color_dots=#ebedf0,#f7c1c7,#ee8792,#d93a4d,#a3101f
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff4558&color_dots=#161b22,#4a0a12,#7d0f1c,#b8162a,#ff4558

      - name: Publish animation assets
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
