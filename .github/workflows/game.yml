name: Tic-tac-toe move

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# one move at a time, in the order they arrive
concurrency:
  group: game
  cancel-in-progress: false

jobs:
  move:
    if: startsWith(github.event.issue.title, 'ttt|')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # the issue title is untrusted: it reaches the script only as an environment variable
      - name: Play the move
        env:
          TITLE: ${{ github.event.issue.title }}
          PLAYER: ${{ github.event.issue.user.login }}
        run: python3 game/play.py

      - name: Save the board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json
          git diff --cached --quiet || git commit -m "game: play a move"
          git push

      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$(cat game/reply.txt)"
